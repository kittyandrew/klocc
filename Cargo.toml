[workspace]
members = [
  "crates/klocc-artifact",
  "crates/klocc",
  "crates/klocc-gui",
  "crates/kloccd",
]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
gpui = { git = "https://github.com/zed-industries/zed.git", package = "gpui", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", package = "gpui_platform", default-features = false, features = ["font-kit", "wayland"] }
lazy_static = "1.5.0"
prometheus = { version = "0.14.0", default-features = false }
rocket = { version = "0.5.1", features = ["json"] }
rocket_cors = { version = "0.6.0", default-features = false }
rusqlite = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
tokei = "14.0.0"
toml = "0.8.23"
unicode-segmentation = "1.12.0"
proptest = "1.9.0"
